name: QA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop-rust:
    name: Desktop (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test

  static-qa:
    name: Static QA
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static QA
        run: npm run qa

  smoke:
    name: Smoke / ${{ matrix.name }}
    needs: static-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/yow-ms-playwright
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: launch
            spec: tests/e2e/launch-smoke.spec.js
          - name: project-types
            spec: tests/e2e/project-types.spec.js
          - name: export-formats
            spec: tests/e2e/export-formats.spec.js
          - name: responsive
            spec: tests/e2e/responsive-smoke.spec.js
          - name: autosave
            spec: tests/e2e/autosave.spec.js
          - name: manuscript-structure
            spec: tests/e2e/manuscript-structure.spec.js
          - name: worldbuilding
            spec: tests/e2e/worldbuilding.spec.js
          - name: dashboard
            spec: tests/e2e/dashboard.spec.js
          - name: comic-planner
            spec: tests/e2e/comic-planner.spec.js
          - name: data-safety
            spec: tests/e2e/data-safety.spec.js
          - name: url-persistence
            spec: tests/e2e/url-persistence.spec.js
          - name: account-isolation
            spec: tests/e2e/account-isolation.spec.js
          - name: project-type-labels
            spec: tests/e2e/project-type-labels.spec.js
          - name: import-into-existing-project
            spec: tests/e2e/import-into-existing-project.spec.js
          - name: merge-project
            spec: tests/e2e/merge-project.spec.js
          # Added 2026-08-28. This spec existed in tests/e2e/ from the start but
          # was never listed here, so CI ran 13 of the directory's 14 files and
          # nothing flagged the gap — it had rotted to 4/4 failing against the
          # manuscript-editor-redesign toolbar entirely unnoticed. This list is
          # now checked against `tests/e2e/*.spec.js` by `npm run check:e2e-matrix`
          # (part of `npm run qa`, which the static-qa job above runs and which
          # this job depends on), so adding a spec without adding it here fails
          # the build rather than going silently unrun.
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.name }} smoke tests
        run: npx playwright test --config playwright.config.mjs ${{ matrix.spec }}

      - name: Upload smoke test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.name }}-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
