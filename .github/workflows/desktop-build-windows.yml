name: Desktop Build (Windows)

# Manual build of the unsigned Windows installer. Runs on GitHub's free
# windows-latest runner — no local Windows machine or paid signing
# certificate required. The resulting .exe is unsigned: Windows SmartScreen
# will show a "protected your PC" warning on first run, bypassed with
# "More info" -> "Run anyway". See docs/ROADMAP.md Phase 6 for the signed
# path once a code-signing certificate is in place.

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Require Supabase build settings
        # Without these the app is built pointing at a placeholder server and
        # every sign-in fails with "fetch is aborted" after 20 seconds.
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Pasted secrets often carry a trailing newline/space; strip it and
          # hand the cleaned values to the build step.
          URL="$(printf '%s' "$VITE_SUPABASE_URL" | tr -d '[:space:]')"
          KEY="$(printf '%s' "$VITE_SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Add repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions). The desktop app cannot sign in without them."
            exit 1
          fi
          if ! printf '%s' "$URL" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$'; then
            # Shape facts only (never the value itself).
            echo "::error::VITE_SUPABASE_URL must look like https://<project-ref>.supabase.co. Seen: length=${#URL}, starts_with_https=$(case "$URL" in https://*) echo yes;; *) echo no;; esac), ends_with_supabase_co=$(case "$URL" in *.supabase.co) echo yes;; *) echo no;; esac), has_path_or_slash_after_host=$(printf '%s' "${URL#https://}" | grep -q '/' && echo yes || echo no), has_uppercase=$(printf '%s' "$URL" | grep -q '[A-Z]' && echo yes || echo no)"
            exit 1
          fi
          if ! printf '%s' "$KEY" | grep -Eq '^(eyJ[A-Za-z0-9_.-]+|sb_publishable_[A-Za-z0-9_-]+)$'; then
            echo "::error::VITE_SUPABASE_ANON_KEY must be the anon public key (starts with eyJ or sb_publishable_)."
            exit 1
          fi
          echo "VITE_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Build Windows installer
        env:
          # Optional: if TAURI_UPDATER_PRIVATE_KEY[/_PASSWORD] repo secrets are
          # set, Tauri signs the bundle for the auto-updater (a project-owned
          # minisign signature, unrelated to and free regardless of OS-level
          # code signing). Unset secrets leave these blank and the build
          # proceeds unsigned, same as before.
          # VITE_SUPABASE_* come from the guard step above (trimmed, via GITHUB_ENV).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build:nsis

      - name: Record installer hashes
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          sha256sum *.exe *.exe.sig 2>/dev/null > SHA256SUMS.txt || sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: yow-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload updater signature (only present if signing secrets are set)
        uses: actions/upload-artifact@v4
        with:
          name: yow-windows-installer-sig
          path: src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: ignore
          retention-days: 30
